<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a24">
<title>Bot Ball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}

/* Layout: full-screen vertical pitch on canvas, scoreboard strip on top, dash button bottom-right, overlay cards between matches. Single dark arcade look by choice. */
:root{
  --ground:#121a24; --pitch:#1d3a36; --line:#d9e6dc; --ink:#f1efe6;
  --amber:#ffb020; --rival:#36d3c4; --muted:#93a3a8; --danger:#ff4d6d;
  --shot:#ff7a1a; --ice:#8fd8ff; --wall:#c38cff;
  --display:"Bungee","Impact",system-ui,sans-serif;
  --body:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.hud{display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 16px;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-size:26px;letter-spacing:0;min-width:96px;text-align:center}
.tag{min-width:56px;text-align:center}
.net{position:absolute;top:44px;left:16px;right:16px;text-align:center;pointer-events:none;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.net.live{color:var(--rival)}
canvas{flex:1;min-height:0;width:100%;display:block}
.dash{position:absolute;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:3px solid var(--amber);background:rgba(255,176,32,.16);color:var(--amber);font-family:var(--display);font-size:16px;touch-action:none}
.dash:active,.dash.on{background:var(--amber);color:var(--ground)}
.dash.mega{border-color:var(--shot);color:var(--shot);background:rgba(255,122,26,.2)}
.dash:focus-visible,.btn:focus-visible,.btn2:focus-visible,.opt button:focus-visible,.code:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(10,16,22,.8);overflow-y:auto}
.card{max-width:350px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.card h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.card h1 span{color:var(--amber)}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:15px}
.card .err{color:var(--danger);font-size:14px;min-height:1em}
.btn{font-family:var(--display);font-size:20px;padding:14px 32px;border:0;border-radius:10px;background:var(--amber);color:var(--ground);cursor:pointer}
.btn2{font-family:var(--body);font-weight:700;font-size:15px;padding:11px 22px;border-radius:10px;border:2px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;line-height:1}
.roomcode{font-family:var(--display);font-size:52px;letter-spacing:.12em;color:var(--amber);line-height:1}
.code{font-family:var(--display);font-size:28px;letter-spacing:.2em;text-transform:uppercase;text-align:center;width:9ch;padding:8px 6px;border-radius:10px;border:2px solid var(--muted);background:#0d141c;color:var(--ink)}
.or{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.opt .grp{display:flex;gap:6px}
.opt button{font-family:var(--body);font-weight:700;font-size:13px;padding:7px 11px;border-radius:8px;border:2px solid #3a4a52;background:transparent;color:var(--ink);cursor:pointer}
.opt button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div class="app">
  <div class="hud">
    <span class="tag" id="tagMe" style="color:#ffb020">You</span>
    <span class="score" id="score">0 – 0</span>
    <span class="tag" id="tagOther" style="color:#36d3c4">Zapp</span>
  </div>
  <div class="net" id="net" hidden></div>
  <canvas id="c"></canvas>
  <button class="dash" id="dash" aria-label="Dash">DASH</button>
  <div class="overlay" id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,S=1,DPR=1;
const HW=0.62,HH=1.0,GW=0.2,BR=0.07,BALLR=0.045,WIN=3,PUR=0.05;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);W=r.width;H=r.height;S=Math.min(W/(HW*2+0.12),H/(HH*2+0.2));}
window.addEventListener('resize',resize);

const ACC=2.4,MAXV=0.85,DASH_V=1.6,DASH_T=0.22,DASH_CD=1.0;
const COL=['#ffb020','#36d3c4'],DARK=['#8a5a00','#11665e'];
const PU={shot:{color:'#ff7a1a'},freeze:{color:'#8fd8ff'},wall:{color:'#c38cff'}};
let you,rival,ball,parts=[],pups=[],walls=[0,0],shake=0,state='menu',time=0,sc=[0,0],pause=0;
let flashK='',goalScorer=0,goalOwn=false,msgK='',msgA=0,msgT=0,jam=0,nextPU=6,lastTouch=null;
const opt={diff:0.9,ownGoals:false,powerups:true};
try{Object.assign(opt,JSON.parse(localStorage.getItem('botball_opts')||'{}'))}catch(e){}

// ---- perspective: bot 0 (`you`) is the host or offline player, bot 1 (`rival`) is Zapp or the online guest
let mode='offline'; // 'offline' | 'host' | 'guest'
const me=()=>mode==='guest'?1:0;
const otherName=()=>mode==='offline'?'ZAPP':'FRIEND';
const isMine=b=>(b===you)===(me()===0);
function setHud(){
  $('tagMe').textContent='You';$('tagMe').style.color=COL[me()];
  $('tagOther').textContent=mode==='offline'?'Zapp':'Friend';$('tagOther').style.color=COL[1-me()];
  updateScore();
}
function updateScore(){$('score').textContent=sc[me()]+' – '+sc[1-me()]}

function mkBot(i,x,y,fy){return{color:COL[i],dark:DARK[i],x,y,fx:0,fy,vx:0,vy:0,dash:0,cd:0,trail:[],mega:0,frozen:0,stun:0,touch:-9}}
function kickoff(){
  const ym=you?you.mega:0,rm=rival?rival.mega:0;
  you=mkBot(0,0,0.55,-1);rival=mkBot(1,0,-0.55,1);
  you.mega=ym;rival.mega=rm;
  ball={x:0,y:0,vx:0,vy:0,spin:0,hot:0};jam=0;lastTouch=null;
}
function newMatch(){sc=[0,0];you=rival=null;kickoff();parts=[];pups=[];walls=[0,0];nextPU=5+Math.random()*3;state='play';pause=1.0;flashK='ready';msgT=0;setHud();$('overlay').hidden=true}

// ---- messages, worded for whoever is looking
function say(k,actor,dur=1.4){msgK=k;msgA=actor;msgT=dur}
function msgText(){
  const mine=msgA===me(),o=otherName();
  switch(msgK){
    case 'shot':return mine?['POWER SHOT READY','#ff7a1a']:[o+' HAS A POWER SHOT','#ff7a1a'];
    case 'freeze':return mine?[o+' FROZEN','#8fd8ff']:['YOU ARE FROZEN','#8fd8ff'];
    case 'wall':return mine?['GOAL WALL UP','#c38cff']:[o+' PUT UP A GOAL WALL','#c38cff'];
    case 'noown':return['NO OWN GOALS','#93a3a8'];
    case 'blast':return['BLAST!','#ff4d6d'];
    case 'power':return['POWER SHOT!','#ff7a1a'];
  }
  return['','#fff'];
}
function flashText(){
  if(flashK==='ready')return['READY','#ffb020'];
  if(flashK==='go')return['GO','#ffb020'];
  if(flashK==='goal'){const c=COL[goalScorer];if(goalOwn)return['OWN GOAL',c];return goalScorer===me()?['GOAL!',c]:[otherName()+' SCORES',c]}
  return null;
}

// ---- menu cards
function optsHTML(){
  const p=(v,cur)=>`aria-pressed="${v===cur}"`;
  return `<div class="opts">
    ${mode==='offline'?`<div class="opt">Zapp<span class="grp">
      <button data-k="diff" data-v="0.75" ${p(0.75,opt.diff)}>Easy</button>
      <button data-k="diff" data-v="0.9" ${p(0.9,opt.diff)}>Normal</button>
      <button data-k="diff" data-v="1.05" ${p(1.05,opt.diff)}>Hard</button></span></div>`:''}
    <div class="opt">Own goals<span class="grp">
      <button data-k="ownGoals" data-v="1" ${p(true,opt.ownGoals)}>On</button>
      <button data-k="ownGoals" data-v="0" ${p(false,opt.ownGoals)}>Off</button></span></div>
    <div class="opt">Power-ups<span class="grp">
      <button data-k="powerups" data-v="1" ${p(true,opt.powerups)}>On</button>
      <button data-k="powerups" data-v="0" ${p(false,opt.powerups)}>Off</button></span></div>
  </div>`;
}
function bindOpts(){
  document.querySelectorAll('.opt button').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;opt[k]=k==='diff'?+b.dataset.v:b.dataset.v==='1';
    try{localStorage.setItem('botball_opts',JSON.stringify(opt))}catch(e){}
    b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  }));
}
function card(html){$('card').innerHTML=html;$('overlay').hidden=false}
const on=(id,fn)=>{const e=$(id);if(e)e.addEventListener('click',fn)};
const LEGEND=`<div class="legend"><span><i style="background:#ff7a1a"></i>Power shot</span><span><i style="background:#8fd8ff"></i>Freeze</span><span><i style="background:#c38cff"></i>Goal wall</span></div>`;

function startCard(){
  mode='offline';setHud();state='menu';
  card(`<h1>Bot<br><span>Ball</span></h1>
    <p>1v1 robot soccer. Score in the goal at the top of your screen, defend the one at the bottom. Dash into the ball to shoot, or into your rival to tackle. First to 3 wins.</p>
    ${LEGEND}
    <div class="row"><button class="btn" id="go">Play Zapp</button></div>
    <button class="btn2" id="online">Play a friend online</button>
    <p style="font-size:12px">Drag on the screen to drive. Keyboard: WASD or arrows, Space to dash. Crowd the ball in a corner for 3 seconds and everything gets blasted out.</p>`);
  on('go',offlineSetup);on('online',()=>onlineCard());
}
function offlineSetup(){
  mode='offline';
  card(`<h2>Match settings</h2>${optsHTML()}<div class="row"><button class="btn" id="go">Kick off</button></div><button class="btn2" id="back">Back</button>`);
  bindOpts();on('go',newMatch);on('back',startCard);
}
function endMatch(){
  state='menu';const won=sc[me()]>sc[1-me()];
  const o=mode==='offline'?'Zapp':'Your friend';
  if(mode==='host'){
    card(`<div class="big">${sc[0]} – ${sc[1]}</div><h1>${won?'You <span>win</span>':o+' <span>wins</span>'}</h1>
      ${optsHTML()}<div class="row"><button class="btn" id="go">Rematch</button></div><button class="btn2" id="leave">Leave room</button>`);
    bindOpts();on('go',newMatch);on('leave',leaveRoom);return;
  }
  card(`<div class="big">${sc[0]} – ${sc[1]}</div>
    <h1>${won?'You <span>win</span>':'Zapp <span>wins</span>'}</h1>
    <p>${won?'Nice finishing. Try Hard mode next.':'Tip: get behind the ball first, then dash through it toward the goal.'}</p>
    ${optsHTML()}<div class="row"><button class="btn" id="go">Rematch</button></div><button class="btn2" id="menu">Main menu</button>`);
  bindOpts();on('go',newMatch);on('menu',startCard);
}

// ---- online (room code)
let R,room=null,roomCode='',gIn=[0,0],gDash=false,gSeq=-1,mySeq=0,lastNet=0,lastS=null,peerSeen=0,hadPeer=false;
let roomErr='';
// Direct phone-to-phone link (WebRTC via PeerJS). Exposes the same presence/peers shape the game already uses.
function openRoom(code,role){
  return new Promise(resolve=>{
    if(typeof Peer==='undefined'){roomErr='no_lib';resolve(null);return}
    let local={},remote=null,conn=null,done=false;
    const id='botball-v1-'+code;
    const peer=role==='host'?new Peer(id,{debug:0}):new Peer({debug:0});
    const api={kind:'p2p',
      presence(p){local={...local,...p};if(conn&&conn.open){try{conn.send(p)}catch(e){}}return Promise.resolve()},
      peers(){const out=[{sameTab:true,isMe:true,peer:'me',presence:local}];if(remote)out.push({sameTab:false,isMe:false,peer:'them',presence:remote});return out},
      connected(){return role==='host'?!peer.disconnected&&!peer.destroyed:!!(conn&&conn.open)},
      leave(){try{peer.destroy()}catch(e){}return Promise.resolve()}};
    const wire=c=>{conn=c;
      c.on('open',()=>{try{c.send(local)}catch(e){}if(role==='guest'&&!done){done=true;resolve(api)}});
      c.on('data',d=>{if(d&&typeof d==='object'&&!Array.isArray(d))remote=Object.freeze({...(remote||{}),...d})});
      c.on('close',()=>{remote=null;if(conn===c)conn=null});
      c.on('error',()=>{});};
    peer.on('open',()=>{if(role==='host'){done=true;resolve(api)}else wire(peer.connect(id,{serialization:'json',reliable:false}))});
    peer.on('connection',c=>{if(role!=='host')return;if(conn&&conn.open){c.close();return}remote=null;wire(c)});
    peer.on('error',e=>{roomErr=e&&e.type||'error';if(!done){done=true;try{peer.destroy()}catch(_){}resolve(null)}});
    setTimeout(()=>{if(!done){done=true;roomErr='timeout';try{peer.destroy()}catch(_){}resolve(null)}},12000);
  });
}
function whyOffline(){
  const map={no_lib:'Could not load the online library. Check your internet connection and reload.',
    'peer-unavailable':'No game found with that code. Check it with your friend, and make sure they are still on the code screen.',
    'unavailable-id':'That room code is busy. Tap Host a game again for a new code.',
    network:'Could not reach the matchmaking server. Check your internet connection.',
    timeout:'Connecting took too long. Both phones need internet; try Wi-Fi if you are on mobile data.',
    'server-error':'The free matchmaking server is busy. Try again in a minute.'};
  return map[roomErr]||('Could not connect ('+(roomErr||'unknown')+'). Try again.');
}
const ALPH='abcdefghjkmnpqrstuvwxyz23456789';
function onlineCard(err=''){
  card(`<h2>Play a friend</h2>
    <p>Send your friend this page's link. One of you hosts, the other joins with the code. Works best on Wi-Fi.</p>
    <button class="btn" id="host">Host a game</button>
    <span class="or">or join with a code</span>
    <div class="row"><input class="code" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" placeholder="CODE"><button class="btn2" id="join">Join</button></div>
    <div class="err" id="err">${err}</div>
    <button class="btn2" id="back">Back</button>`);
  on('host',hostGame);on('join',()=>joinGame($('code').value));on('back',startCard);
  $('code').addEventListener('keydown',e=>{if(e.key==='Enter')joinGame($('code').value)});
}
function connectingCard(t){card(`<h2>${t}</h2><p>Connecting<span class="dots"></span></p>`)}
async function hostGame(){
  connectingCard('Opening a room');
  roomCode=Array.from({length:4},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
  room=await openRoom(roomCode,'host');
  if(!room){onlineCard(whyOffline());return}
  mode='host';state='lobby';hadPeer=false;gSeq=-1;setHud();
  room.presence({role:'host',s:{st:'lobby'}}).catch(()=>{});
  card(`<h2>Your room code</h2><div class="roomcode">${roomCode.toUpperCase()}</div>
    <p>Send this code to your friend. The match starts as soon as they join<span class="dots"></span></p>
    ${optsHTML()}<button class="btn2" id="leave">Cancel</button>`);
  bindOpts();on('leave',leaveRoom);
}
async function joinGame(raw){
  const code=String(raw||'').trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code)){onlineCard('Enter the 4-character code from your friend.');return}
  connectingCard('Joining '+code.toUpperCase());
  room=await openRoom(code,'guest');
  if(!room){onlineCard(whyOffline());return}
  roomCode=code;mode='guest';state='lobby';lastS=null;hadPeer=false;peerSeen=performance.now();mySeq=0;inSeq=0;hist=[];guestPaused=true;
  kickoff();sc=[0,0];setHud();
  room.presence({role:'guest',i:[0,0],d:0}).catch(()=>{});
  card(`<h2>Joining ${code.toUpperCase()}</h2><p>Waiting for the host<span class="dots"></span></p><button class="btn2" id="leave">Cancel</button>`);
  on('leave',leaveRoom);
  setTimeout(()=>{if(mode==='guest'&&!hadPeer&&state==='lobby'){const c=room&&room.connected();leaveRoom();
    onlineCard('Connected, but the host did not start the match. Ask your friend to host again and send you the new code.')}},15000);
}
function leaveRoom(){
  const r=room;room=null;if(r)r.leave().catch(()=>{});
  $('net').hidden=true;startCard();
}
function peerWith(role){if(!room)return null;try{return room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.role===role)||null}catch(e){return null}}
const num=(v,lo,hi)=>typeof v==='number'&&isFinite(v)?Math.max(lo,Math.min(hi,v)):0;

// Host is the referee: it runs the real match and sends snapshots.
// The guest predicts its own bot from its own input (replaying inputs the host hasn't seen yet)
// and dead-reckons the ball and host bot from their velocities, so its screen reacts instantly.
let gAck=0,inSeq=0,hist=[],rtt=150,pendingDash=false,netT=0;
function hostNet(now){
  const gp=peerWith('guest');
  if(gp){
    peerSeen=now;hadPeer=true;
    const i=Array.isArray(gp.presence.i)?gp.presence.i:[0,0];
    gIn=[num(i[0],-1,1),num(i[1],-1,1)];
    const d=gp.presence.d;
    if(typeof d==='number'){if(gSeq>=0&&d!==gSeq)gDash=true;gSeq=d}
    if(typeof gp.presence.q==='number')gAck=gp.presence.q;
    if(state==='lobby')newMatch();
  }else if(hadPeer&&now-peerSeen>3500&&state!=='lobby'){
    hadPeer=false;state='lobby';
    card(`<h2>Your friend left</h2><p>Room ${roomCode.toUpperCase()} is still open if they come back<span class="dots"></span></p><button class="btn2" id="leave">Leave room</button>`);
    on('leave',leaveRoom);
  }
  netBadge(!!gp);
  if(now-lastNet>30){lastNet=now;room.presence({role:'host',s:pack()}).catch(()=>{})}
}
function guestNet(now){
  const hp=peerWith('host');
  if(hp){peerSeen=now;hadPeer=true;const s=hp.presence.s;if(s&&s!==lastS){lastS=s;applyState(s,now)}}
  else if(hadPeer&&now-peerSeen>3500){hadPeer=false;leaveRoom();onlineCard('The host left the game.');return}
  netBadge(!!hp);
  if(now-lastNet>25){lastNet=now;const[x,y]=playerInput();room.presence({role:'guest',i:[Math.round(-x*100)/100,Math.round(-y*100)/100],d:mySeq,q:inSeq}).catch(()=>{})}
}
function netBadge(ok){const n=$('net');n.hidden=false;const c=room&&room.connected();
  n.textContent=(ok?'● LIVE ':c?'○ WAITING ':'✕ OFFLINE ')+roomCode.toUpperCase()+(ok&&mode==='guest'?' · '+Math.round(rtt)+'ms':'');n.classList.toggle('live',ok)}

function pack(){
  const r=v=>Math.round(v*1000)/1000;
  const B=b=>[r(b.x),r(b.y),r(b.fx),r(b.fy),r(b.dash),b.mega>0?1:0,r(Math.max(0,b.frozen)),r(b.cd),r(Math.max(0,b.stun)),r(b.vx),r(b.vy)];
  return{st:state==='menu'?'over':state,a:B(you),z:B(rival),b:[r(ball.x),r(ball.y),r(ball.spin),ball.hot>0?1:0,r(ball.vx),r(ball.vy)],sc,
    p:pups.map(p=>[r(p.x),r(p.y),p.type[0],r(p.life)]),w:[r(walls[0]),r(walls[1])],j:r(jam),f:flashK,g:[goalScorer,goalOwn?1:0],
    m:msgT>0?[msgK,msgA,r(msgT)]:0,k:Math.round(shake),o:opt.powerups?1:0,q:gAck,pz:pause>0?1:0};
}
function applyState(s,now){
  if(typeof s!=='object'||!s)return;
  if(s.st==='lobby')return;
  netT=now;
  // other bot + ball: remember the snapshot for dead reckoning
  const a=s.a;
  if(Array.isArray(a)){you.net={x:num(a[0],-1,1),y:num(a[1],-1.2,1.2),vx:num(a[9],-5,5),vy:num(a[10],-5,5),t:now};
    you.fx=num(a[2],-1,1);you.fy=num(a[3],-1,1);you.dash=num(a[4],0,1);you.mega=a[5]?1:0;you.frozen=num(a[6],0,3);you.cd=num(a[7],0,DASH_CD);you.stun=num(a[8],0,1)}
  if(Array.isArray(s.b)){ball.net={x:num(s.b[0],-1,1),y:num(s.b[1],-1.3,1.3),vx:num(s.b[4],-5,5),vy:num(s.b[5],-5,5),t:now};ball.spin=num(s.b[2],-1e4,1e4);ball.hot=s.b[3]?1:0}
  // own bot: take the host's word, then replay inputs it hasn't processed yet
  const z=s.z,ack=typeof s.q==='number'?s.q:0;
  const sent=hist.find(h=>h.q===ack);if(sent){rtt=rtt*0.85+(now-sent.t)*0.15}
  if(Array.isArray(z)){
    const b=rival,ox=b.x+(b.ox||0),oy=b.y+(b.oy||0);
    b.x=num(z[0],-1,1);b.y=num(z[1],-1.2,1.2);b.vx=num(z[9],-5,5);b.vy=num(z[10],-5,5);
    b.dash=num(z[4],0,1);b.mega=z[5]?1:0;b.frozen=num(z[6],0,3);b.cd=num(z[7],0,DASH_CD);b.stun=num(z[8],0,1);
    hist=hist.filter(h=>h.q>ack);
    if(!s.pz&&s.st==='play')for(const h of hist){if(h.dash)doDash(b,h.x,h.y);moveBot(b,h.x,h.y,h.dt,true)}

    // hide the correction: show the old spot and glide to the new one
    b.ox=ox-b.x;b.oy=oy-b.y;if(Math.hypot(b.ox,b.oy)>0.3){b.ox=b.oy=0}
  }
  if(Array.isArray(s.sc)){sc=[num(s.sc[0],0,9),num(s.sc[1],0,9)];updateScore()}
  const T={s:'shot',f:'freeze',w:'wall'};
  pups=Array.isArray(s.p)?s.p.slice(0,4).filter(p=>Array.isArray(p)&&T[p[2]]).map(p=>({x:num(p[0],-1,1),y:num(p[1],-1,1),type:T[p[2]],life:num(p[3],0,10),born:0})):[];
  if(Array.isArray(s.w))walls=[num(s.w[0],0,10),num(s.w[1],0,10)];
  jam=num(s.j,0,3);
  flashK=['ready','go','goal'].includes(s.f)?s.f:'';
  if(Array.isArray(s.g)){goalScorer=s.g[0]===1?1:0;goalOwn=!!s.g[1]}
  if(Array.isArray(s.m)){msgK=String(s.m[0]).slice(0,10);msgA=s.m[1]===1?1:0;msgT=num(s.m[2],0,2)}else msgT=0;
  shake=Math.max(shake,num(s.k,0,40));
  guestPaused=!!s.pz;
  const st=['play','goal','over'].includes(s.st)?s.st:'play';
  if(st==='over'&&state!=='over'){state='over';const won=sc[1]>sc[0];
    card(`<div class="big">${sc[1]} – ${sc[0]}</div><h1>${won?'You <span>win</span>':'Your friend <span>wins</span>'}</h1><p>Waiting for the host to start a rematch<span class="dots"></span></p><button class="btn2" id="leave">Leave room</button>`);

let guestPaused=true;
function reckon(o,now,fric,lim){
  if(!o.net)return null;
  const a=Math.min(0.35,(now-o.net.t+rtt/2)/1000);
  const k=fric?(1-Math.exp(-fric*a))/fric:a;
  let x=o.net.x+o.net.vx*k,y=o.net.y+o.net.vy*k;
  x=Math.max(-lim[0],Math.min(lim[0],x));y=Math.max(-lim[1],Math.min(lim[1],y));
  return[x,y];
}
function guestTick(dt){
  time+=dt;const now=performance.now();
  const me=rival,them=you;
  // 1. own bot: predicted locally, instantly
  if(state==='play'&&!guestPaused){
    const[sx,sy]=playerInput(),x=-sx,y=-sy;
    inSeq++;const h={q:inSeq,x,y,dt,dash:pendingDash,t:now};
    if(pendingDash)doDash(me,x,y);pendingDash=false;
    moveBot(me,x,y,dt);hist.push(h);if(hist.length>180)hist.shift();
  }else{pendingDash=false;me.trail.push([me.x,me.y,false]);if(me.trail.length>30)me.trail.shift()}
  const dec=Math.exp(-10*dt);me.ox=(me.ox||0)*dec;me.oy=(me.oy||0)*dec;
  // 2. host bot: extrapolate from its last speed, then glide
  const t=reckon(them,now,2.4,[HW-BR,HH-BR]);
  if(t){if(Math.hypot(t[0]-them.x,t[1]-them.y)>0.35){them.x=t[0];them.y=t[1]}else{const k=Math.min(1,dt*20);them.x+=(t[0]-them.x)*k;them.y+=(t[1]-them.y)*k}
    them.trail.push([them.x,them.y,them.dash>0]);if(them.trail.length>30)them.trail.shift()}
  // keep the two bots from visibly overlapping
  {let nx=me.x-them.x,ny=me.y-them.y,d=Math.hypot(nx,ny);if(d<BR*2&&d>0){me.x+=nx/d*(BR*2-d);me.y+=ny/d*(BR*2-d)}}
  // 3. ball: extrapolate with friction; nudge it off my bot so it never looks like it passes through
  const bt=reckon(ball,now,0.9,[HW-BALLR,HH+0.1]);
  if(bt){if(Math.hypot(bt[0]-ball.x,bt[1]-ball.y)>0.4){ball.x=bt[0];ball.y=bt[1]}else{const k=Math.min(1,dt*25);ball.x+=(bt[0]-ball.x)*k;ball.y+=(bt[1]-ball.y)*k}}
  for(const b of[me,them]){const mx=b.x+(b===me?me.ox:0),my=b.y+(b===me?me.oy:0);let nx=ball.x-mx,ny=ball.y-my,d=Math.hypot(nx,ny);if(d<BR+BALLR&&d>0){ball.x=mx+nx/d*(BR+BALLR);ball.y=my+ny/d*(BR+BALLR)}}
  if(ball.hot&&Math.random()<0.5)spark(ball.x,ball.y,(Math.random()-.5)*0.6,(Math.random()-.5)*0.6,'#ff7a1a',0.3);
  tickParts(dt);
}

// ---- input
const keys={};let joy=null,dashReq=false;
function pressDash(){if(mode==='guest'){mySeq++;pendingDash=true}else dashReq=true}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=true;if(e.key===' '){pressDash();e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener('pointerdown',e=>{if(joy)return;const r=cv.getBoundingClientRect();joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,dx:0,dy:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;const r=cv.getBoundingClientRect();let dx=e.clientX-r.left-joy.ox,dy=e.clientY-r.top-joy.oy;const m=Math.hypot(dx,dy);if(m>50){dx*=50/m;dy*=50/m}joy.dx=dx;joy.dy=dy});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
const db=$('dash');
db.addEventListener('pointerdown',e=>{e.preventDefault();pressDash();db.classList.add('on')});
db.addEventListener('pointerup',()=>db.classList.remove('on'));db.addEventListener('pointerleave',()=>db.classList.remove('on'));

function playerInput(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft'])x--; if(keys['d']||keys['arrowright'])x++;
  if(keys['w']||keys['arrowup'])y--; if(keys['s']||keys['arrowdown'])y++;
  if(joy){x+=joy.dx/50;y+=joy.dy/50}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  return[x,y];
}

// Zapp attacks the bottom goal and defends the top one.
function aiInput(b,dt){
  const d=opt.diff;
  const dBall=Math.hypot(ball.x-b.x,ball.y-b.y);
  for(const p of pups){const dp=Math.hypot(p.x-b.x,p.y-b.y);if(dp<0.35&&dp<dBall*0.9){return[(p.x-b.x)/dp*d,(p.y-b.y)/dp*d]}}
  let tx=-ball.x,ty=HH+0.1-ball.y;const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
  const bx=ball.x-tx*(BR+BALLR+0.04),by=ball.y-ty*(BR+BALLR+0.04);
  const toBallX=ball.x-b.x,toBallY=ball.y-b.y,dB=Math.hypot(toBallX,toBallY)||1;
  const behind=(toBallX/dB)*tx+(toBallY/dB)*ty;
  let ax,ay;
  if(ball.y<b.y-0.05&&ball.y<-0.2){ax=ball.x*0.6;ay=Math.max(-HH+BR,ball.y-0.12)}
  else if(behind>0.75){ax=ball.x;ay=ball.y}
  else{ax=bx;ay=by}
  let dx=ax-b.x,dy=ay-b.y;const dl=Math.hypot(dx,dy);
  if(dl<0.02)return[0,0];
  dx/=dl;dy/=dl;
  if(behind>0.8&&dB<0.24&&b.cd<=0&&Math.random()<dt*6*d)doDash(b,toBallX,toBallY);
  const px=you.x-b.x,py=you.y-b.y,pd=Math.hypot(px,py);
  if(pd<0.2&&Math.hypot(you.x-ball.x,you.y-ball.y)<0.15&&b.cd<=0&&Math.random()<dt*2*d)doDash(b,px,py);
  return[dx*d,dy*d];
}

function doDash(b,x,y){
  if(b.cd>0||b.frozen>0||b.stun>0)return;
  const m=Math.hypot(x,y);if(m<0.1){x=b.fx;y=b.fy}else{x/=m;y/=m}
  b.vx+=x*DASH_V;b.vy+=y*DASH_V;b.dash=DASH_T;b.cd=DASH_CD;b.fx=x;b.fy=y;
  for(let i=0;i<8;i++)spark(b.x-x*BR,b.y-y*BR,-x+(Math.random()-.5),-y+(Math.random()-.5),'#ffffff',0.3);
}
function spark(x,y,vx,vy,c,life){if(parts.length<400)parts.push({x,y,vx:vx*(0.4+Math.random()*0.6),vy:vy*(0.4+Math.random()*0.6),c,life,max:life})}

function moveBot(b,ix,iy,dt,replay){
  b.cd=Math.max(0,b.cd-dt);b.dash=Math.max(0,b.dash-dt);b.mega=Math.max(0,b.mega-dt);
  if(b.frozen>0){b.frozen-=dt;ix=iy=0;b.dash=0}
  const stunned=b.stun>0;if(stunned){b.stun-=dt;ix=iy=0}
  if(Math.hypot(ix,iy)>0.15){b.fx=ix;b.fy=iy}
  b.vx+=ix*ACC*dt;b.vy+=iy*ACC*dt;
  const f=Math.exp(-(stunned?0.7:b.frozen>0?6:b.dash>0?0.8:2.4)*dt);b.vx*=f;b.vy*=f;
  if(stunned&&!replay&&Math.random()<0.5)spark(b.x,b.y,(Math.random()-.5)*0.5,(Math.random()-.5)*0.5,'#ff4d6d',0.3);
  const sp=Math.hypot(b.vx,b.vy);if(sp>MAXV&&b.dash<=0&&!stunned){const k=Math.pow(MAXV/sp,dt*6);b.vx*=k;b.vy*=k}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(Math.abs(b.x)>HW-BR){b.x=Math.sign(b.x)*(HW-BR);b.vx*=-0.3}
  if(Math.abs(b.y)>HH-BR){b.y=Math.sign(b.y)*(HH-BR);b.vy*=-0.3}
  if(!replay){b.trail.push([b.x,b.y,b.dash>0]);if(b.trail.length>30)b.trail.shift()}
}

// ---- power-ups
function spawnPU(){
  const types=Object.keys(PU);
  for(let tries=0;tries<20;tries++){
    const x=(Math.random()*2-1)*(HW-0.14),y=(Math.random()*2-1)*0.62;
    if([you,rival,ball].some(o=>Math.hypot(o.x-x,o.y-y)<0.25))continue;
    if(pups.some(p=>Math.hypot(p.x-x,p.y-y)<0.3))continue;
    pups.push({x,y,type:types[Math.floor(Math.random()*types.length)],life:10,born:time});
    return;
  }
}
function pickup(b,p){
  const other=b===you?rival:you,c=PU[p.type].color,a=b===you?0:1;
  if(p.type==='shot'){b.mega=8;say('shot',a)}
  if(p.type==='freeze'){other.frozen=2.5;other.vx*=0.2;other.vy*=0.2;say('freeze',a);for(let k=0;k<20;k++)spark(other.x,other.y,(Math.random()-.5)*2,(Math.random()-.5)*2,c,0.6)}
  if(p.type==='wall'){walls[a===0?1:0]=5;say('wall',a)}
  for(let k=0;k<14;k++)spark(p.x,p.y,(Math.random()-.5)*2.5,(Math.random()-.5)*2.5,c,0.5);
}

// ---- corner jam
function blast(){
  const cx=-Math.sign(ball.x)||1,cy=-Math.sign(ball.y)||1;
  const launch=(o,spread,power)=>{const a=Math.atan2(cy,cx)+spread;o.vx=Math.cos(a)*power;o.vy=Math.sin(a)*power};
  ball.x=Math.sign(ball.x)*(HW-0.2);ball.y=Math.sign(ball.y)*(HH-0.2);
  launch(ball,(Math.random()-.5)*0.6,4.0);ball.hot=0.9;
  launch(you,0.75,2.8);launch(rival,-0.75,2.8);
  you.dash=rival.dash=0;you.stun=rival.stun=0.7;
  shake=30;say('blast',0,1);
  for(let k=0;k<50;k++)spark(ball.x,ball.y,(Math.random()-.5)*5,(Math.random()-.5)*5,k%2?'#ff4d6d':'#ffb020',0.8);
  jam=0;
}

function step(dt){
  time+=dt;msgT=Math.max(0,msgT-dt);
  if(pause>0){pause-=dt;if(pause<=0){flashK='';if(state==='goal'){if(sc[0]>=WIN||sc[1]>=WIN){endMatch();return}kickoff();state='play';pause=0.8;flashK='go'}}if(state!=='play'||pause>0){tickParts(dt);dashReq=false;gDash=false;return}}
  walls[0]=Math.max(0,walls[0]-dt);walls[1]=Math.max(0,walls[1]-dt);
  const[ix,iy]=playerInput();if(dashReq)doDash(you,ix,iy);dashReq=false;
  let ax,ay;
  if(mode==='host'){[ax,ay]=gIn;if(gDash)doDash(rival,ax,ay);gDash=false}
  else[ax,ay]=rival.frozen>0?[0,0]:aiInput(rival,dt);
  if(opt.powerups){
    nextPU-=dt;if(nextPU<=0){if(pups.length<2)spawnPU();nextPU=5+Math.random()*6}
    for(const p of pups){p.life-=dt;for(const b of[you,rival])if(p.life>0&&Math.hypot(p.x-b.x,p.y-b.y)<BR+PUR){pickup(b,p);p.life=0}}
    pups=pups.filter(p=>p.life>0);
  }else pups=[];
  // physics runs in small substeps so fast dashes and shots can't tunnel through bots
  const SUB=5,hdt=dt/SUB;
  for(let s=0;s<SUB&&state==='play';s++){
    moveBot(you,ix,iy,hdt);moveBot(rival,ax,ay,hdt);
    // bot vs bot
    let nx=rival.x-you.x,ny=rival.y-you.y,d=Math.hypot(nx,ny);
    if(d<BR*2&&d>0){nx/=d;ny/=d;const ov=BR*2-d;you.x-=nx*ov/2;you.y-=ny*ov/2;rival.x+=nx*ov/2;rival.y+=ny*ov/2;
      const vr=(you.vx-rival.vx)*nx+(you.vy-rival.vy)*ny;
      if(vr>0){you.vx-=nx*vr;you.vy-=ny*vr;rival.vx+=nx*vr;rival.vy+=ny*vr;
        if(you.dash>0){rival.vx+=nx*0.8;rival.vy+=ny*0.8}
        if(rival.dash>0){you.vx-=nx*0.8;you.vy-=ny*0.8}
        if(you.dash>0||rival.dash>0){shake=10;for(let k=0;k<12;k++)spark(you.x+nx*BR,you.y+ny*BR,(Math.random()-.5)*3,(Math.random()-.5)*3,k%2?'#ffb020':'#fff',0.4)}}}
    // bots vs ball
    for(const b of[you,rival]){
      let bx=ball.x-b.x,by=ball.y-b.y,bd=Math.hypot(bx,by);
      if(bd<BR+BALLR&&bd>0){bx/=bd;by/=bd;ball.x=b.x+bx*(BR+BALLR);ball.y=b.y+by*(BR+BALLR);
        lastTouch=b;b.touch=time;
        const vr=(b.vx-ball.vx)*bx+(b.vy-ball.vy)*by;
        if(vr>0){ball.vx+=bx*vr*1.5;ball.vy+=by*vr*1.5;b.vx-=bx*vr*0.15;b.vy-=by*vr*0.15}
        if(b.dash>0){
          const mega=b.mega>0;
          ball.vx+=bx*(mega?3.2:1.3);ball.vy+=by*(mega?3.2:1.3);b.dash=0;shake=mega?18:8;
          if(mega){b.mega=0;ball.hot=0.9;say('power',b===you?0:1,0.9)}
          for(let k=0;k<(mega?28:10);k++)spark(ball.x,ball.y,bx*2+(Math.random()-.5),by*2+(Math.random()-.5),mega?'#ff7a1a':'#fff',0.4)}
        ball.spin+=(bx*b.vy-by*b.vx)*3;}
    }
    // squeeze: ball pinched between both bots pops out sideways instead of passing through one
    {
      const touchA=Math.hypot(ball.x-you.x,ball.y-you.y)<BR+BALLR+0.004;
      const touchB=Math.hypot(ball.x-rival.x,ball.y-rival.y)<BR+BALLR+0.004;
      if(touchA&&touchB){
        let ux=rival.x-you.x,uy=rival.y-you.y;const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;
        const px=-uy,py=ux,mx=(you.x+rival.x)/2,my=(you.y+rival.y)/2;
        const proj=(ball.x-mx)*px+(ball.y-my)*py;
        let side=Math.abs(proj)<0.004?(Math.random()<0.5?-1:1):Math.sign(proj);
        const tx=mx+px*side*0.15,ty=my+py*side*0.15;
        if(Math.abs(tx)>HW-BALLR||Math.abs(ty)>HH-BALLR)side=-side;
        const half=L/2,off=Math.sqrt(Math.max(0,(BR+BALLR)**2-half*half))+0.006;
        ball.x=mx+px*side*off;ball.y=my+py*side*off;
        const closing=Math.max(0,(you.vx-rival.vx)*ux+(you.vy-rival.vy)*uy);
        const pop=0.5+closing*1.3;
        ball.vx=(you.vx+rival.vx)/2+px*side*pop;ball.vy=(you.vy+rival.vy)/2+py*side*pop;
        ball.spin+=side*4;
        if(closing>0.6){shake=Math.max(shake,8);for(let k=0;k<8;k++)spark(ball.x,ball.y,px*side*1.5+(Math.random()-.5),py*side*1.5+(Math.random()-.5),'#fff',0.3)}
      }
    }
    // ball physics
    ball.hot=Math.max(0,ball.hot-hdt);
    const f=Math.exp(-0.9*hdt);ball.vx*=f;ball.vy*=f;
    const cap=ball.hot>0?4.2:2.6,bs=Math.hypot(ball.vx,ball.vy);if(bs>cap){ball.vx*=cap/bs;ball.vy*=cap/bs}
    const prevY=ball.y;
    ball.x+=ball.vx*hdt;ball.y+=ball.vy*hdt;ball.spin*=Math.exp(-hdt);
    if(Math.abs(ball.x)>HW-BALLR){ball.x=Math.sign(ball.x)*(HW-BALLR);ball.vx*=-0.8}
    if(ball.hot>0&&Math.random()<0.15)spark(ball.x,ball.y,(Math.random()-.5)*0.6,(Math.random()-.5)*0.6,'#ff7a1a',0.3);
    const inMouth=Math.abs(ball.x)<GW-BALLR*0.5;
    const line=HH-BALLR;
    if(Math.abs(ball.y)>line){
      const side=ball.y<0?0:1; // 0 = top goal (bot 1's), 1 = bottom goal (bot 0's)
      const crossing=Math.abs(prevY)<=line;
      const owner=side===0?rival:you,attacker=side===0?you:rival;
      let blocked=!inMouth;
      if(inMouth&&crossing){
        if(walls[side]>0){blocked=true;for(let k=0;k<8;k++)spark(ball.x,ball.y,(Math.random()-.5)*2,-Math.sign(ball.y)*Math.random()*2,'#c38cff',0.4)}
        // only a real own goal: the defender touched it last AND the attacker hasn't touched it recently (not a deflection)
        else if(!opt.ownGoals&&lastTouch===owner&&time-attacker.touch>1.5){blocked=true;say('noown',0,0.9)}
      }
      if(blocked&&(crossing||!inMouth)){ball.y=Math.sign(ball.y)*line;ball.vy*=-0.8}
      else if(inMouth&&Math.abs(ball.y)>HH+BALLR*1.2)goal(side);
    }
    if(Math.abs(ball.y)>line&&Math.abs(ball.x)>GW-BALLR){ball.x=Math.sign(ball.x)*(GW-BALLR);ball.vx*=-0.6}
  }
  if(state!=='play'){tickParts(dt);return}
  // corner jam: both bots crowding the ball in a corner
  const corner=Math.abs(ball.x)>HW-0.18&&Math.abs(ball.y)>HH-0.18;
  const near=b=>Math.hypot(b.x-ball.x,b.y-ball.y)<0.26;
  if(corner&&near(you)&&near(rival))jam+=dt;else jam=Math.max(0,jam-dt*3);
  if(jam>=3)blast();
  tickParts(dt);
}
function tickParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt}parts=parts.filter(p=>p.life>0);shake*=Math.exp(-8*dt)}

function goal(side){ // side 0 = top goal, scored by bot 0; side 1 = bottom goal, scored by bot 1
  const att=side===0?you:rival;
  goalOwn=((side===0&&lastTouch===rival)||(side===1&&lastTouch===you))&&time-att.touch>1.5;
  goalScorer=side;sc[side]++;updateScore();
  flashK='goal';state='goal';pause=1.4;shake=18;
  pups=[];walls=[0,0];
  for(let k=0;k<40;k++)spark(ball.x,ball.y,(Math.random()-.5)*4,(Math.random()-.5)*4,k%3?COL[side]:'#fff',0.9);
  ball.vx*=0.1;ball.vy*=0.1;
}

// ---- draw (the guest sees the pitch rotated so their own goal is at the bottom)
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#121a24';ctx.fillRect(0,0,W,H);
  const flip=mode==='guest';
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.save();ctx.translate(W/2+sx,H/2+sy);if(flip)ctx.rotate(Math.PI);
  const pw=HW*S,ph=HH*S,gd=0.09*S,gw=GW*S,bw=0.36*S,bh=0.22*S;
  // each goal wears its owner's colour: top = bot 1's, bottom = bot 0's
  ctx.fillStyle='rgba(54,211,196,.18)';ctx.fillRect(-gw,-ph-gd,gw*2,gd);
  ctx.fillStyle='rgba(255,176,32,.18)';ctx.fillRect(-gw,ph,gw*2,gd);
  ctx.lineWidth=3;ctx.strokeStyle=COL[1];ctx.strokeRect(-gw,-ph-gd,gw*2,gd);
  ctx.strokeStyle=COL[0];ctx.strokeRect(-gw,ph,gw*2,gd);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#1d3a36':'#214440';ctx.fillRect(-pw,-ph+i*ph*0.2,pw*2,ph*0.2+1)}
  ctx.fillStyle='rgba(255,77,109,.06)';const cz=0.18*S;
  for(const cx of[-1,1])for(const cy of[-1,1])ctx.fillRect(cx<0?-pw:pw-cz,cy<0?-ph:ph-cz,cz,cz);
  ctx.strokeStyle='rgba(217,230,220,.7)';ctx.lineWidth=2;
  ctx.strokeRect(-pw,-ph,pw*2,ph*2);
  ctx.beginPath();ctx.moveTo(-pw,0);ctx.lineTo(pw,0);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,0.18*S,0,7);ctx.stroke();
  ctx.fillStyle='rgba(217,230,220,.7)';ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();
  ctx.strokeRect(-bw,-ph,bw*2,bh);ctx.strokeRect(-bw,ph-bh,bw*2,bh);
  ctx.beginPath();ctx.arc(0,-ph+bh,0.1*S,0,Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(0,ph-bh,0.1*S,Math.PI,0);ctx.stroke();
  for(const side of[0,1]){const t=walls[side];if(t<=0)continue;if(t<1.5&&Math.sin(time*20)<0)continue;
    const y=side===0?-ph+3:ph-3;ctx.strokeStyle='#c38cff';ctx.lineWidth=7;ctx.shadowColor='#c38cff';ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(-gw-6,y);ctx.lineTo(gw+6,y);ctx.stroke();ctx.shadowBlur=0}
  ctx.fillStyle='#f1efe6';for(const px of[-gw,gw])for(const py of[-ph,ph]){ctx.beginPath();ctx.arc(px,py,4,0,7);ctx.fill()}
  for(const p of pups)drawPU(p);
  if(you&&state!=='menu'||you&&mode==='offline'){drawBot(rival);drawBot(you);drawBall()}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.fillRect(p.x*S-2,p.y*S-2,4,4)}
  ctx.globalAlpha=1;
  ctx.restore();
  // screen-space labels, always from the viewer's side
  const myCol=COL[me()];
  ctx.font='700 13px "Chakra Petch",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=0.55;ctx.fillStyle=myCol;ctx.fillText('▲ SCORE HERE',W/2,H/2-ph+bh*0.5);ctx.fillText('DEFEND ▼',W/2,H/2+ph-bh*0.5);ctx.globalAlpha=1;
  if(you&&jam>0.3){const x=W/2+(flip?-ball.x:ball.x)*S,y=H/2+(flip?-ball.y:ball.y)*S,r=0.22*S;
    ctx.strokeStyle='#ff4d6d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+(jam/3)*Math.PI*2);ctx.stroke();
    ctx.font='400 26px Bungee,Impact,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#121a24';
    const t=String(Math.ceil(3-jam)),ty=y+(y<H/2?r+22:-r-22);ctx.strokeText(t,x,ty);ctx.fillStyle='#ff4d6d';ctx.fillText(t,x,ty)}
  if(joy&&state!=='menu'){ctx.globalAlpha=.5;ctx.strokeStyle='#f1efe6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.ox,joy.oy,50,0,7);ctx.stroke();ctx.fillStyle=myCol;ctx.beginPath();ctx.arc(joy.ox+joy.dx,joy.oy+joy.dy,22,0,7);ctx.fill();ctx.globalAlpha=1}
  const ft=flashText();
  if(ft&&state!=='menu'&&state!=='over'){ctx.font=`400 ${Math.min(52,W*0.12)}px Bungee,Impact,sans-serif`;ctx.lineWidth=6;ctx.strokeStyle='#121a24';ctx.strokeText(ft[0],W/2,H/2);ctx.fillStyle=ft[1];ctx.fillText(ft[0],W/2,H/2)}
  else if(msgT>0){const[t,c]=msgText();ctx.globalAlpha=Math.min(1,msgT*3);ctx.font='700 17px "Chakra Petch",sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#121a24';ctx.strokeText(t,W/2,H/2-60);ctx.fillStyle=c;ctx.fillText(t,W/2,H/2-60);ctx.globalAlpha=1}
  const mine=you?(me()===0?you:rival):null;
  db.classList.toggle('mega',!!(mine&&mine.mega>0));
}

function drawPU(p){
  if(p.life<2&&Math.sin(time*18)<0)return;
  const x=p.x*S,y=p.y*S,r=PUR*S*(1+Math.sin((time-p.born)*5)*0.08),c=PU[p.type].color;
  ctx.fillStyle=c;ctx.globalAlpha=0.22;ctx.beginPath();ctx.arc(x,y,r*1.6,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#121a24';ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.lineCap='round';
  if(p.type==='shot'){ctx.beginPath();ctx.moveTo(x+r*0.15,y-r*0.65);ctx.lineTo(x-r*0.35,y+r*0.08);ctx.lineTo(x,y+r*0.08);ctx.lineTo(x-r*0.15,y+r*0.65);ctx.lineTo(x+r*0.35,y-r*0.08);ctx.lineTo(x,y-r*0.08);ctx.closePath();ctx.fill()}
  if(p.type==='freeze'){for(let i=0;i<3;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*r*0.6,y-Math.sin(a)*r*0.6);ctx.lineTo(x+Math.cos(a)*r*0.6,y+Math.sin(a)*r*0.6);ctx.stroke()}}
  if(p.type==='wall'){ctx.fillRect(x-r*0.55,y-r*0.15,r*1.1,r*0.3);ctx.fillRect(x-r*0.55,y-r*0.45,r*0.2,r*0.9);ctx.fillRect(x+r*0.35,y-r*0.45,r*0.2,r*0.9)}
  ctx.lineCap='butt';
}

function drawBall(){
  const x=ball.x*S,y=ball.y*S,r=BALLR*S;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+r*0.2,y+r*0.35,r,r*0.85,0,0,7);ctx.fill();
  if(ball.hot>0){ctx.fillStyle='rgba(255,122,26,.35)';ctx.beginPath();ctx.arc(x,y,r*1.7,0,7);ctx.fill()}
  ctx.fillStyle=ball.hot>0?'#ffd7b0':'#f4f2ea';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(ball.spin);
  ctx.fillStyle='#22222c';ctx.beginPath();
  for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r*0.42,Math.sin(a)*r*0.42)}ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawBot(b){
  const r=BR*S,x=(b.x+(b.ox||0))*S,y=(b.y+(b.oy||0))*S;
  b.trail.forEach((t,i)=>{if(!t[2]||i%3)return;ctx.globalAlpha=i/b.trail.length*0.35;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(t[0]*S,t[1]*S,r*0.9,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  if(b.mega>0){ctx.strokeStyle='#ff7a1a';ctx.lineWidth=3;ctx.globalAlpha=0.6+Math.sin(time*12)*0.3;ctx.beginPath();ctx.arc(x,y,r+12,0,7);ctx.stroke();ctx.globalAlpha=1}
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+r*0.15,y+r*0.3,r,r*0.9,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(b.fy,b.fx));
  ctx.fillStyle='#14131f';ctx.fillRect(-r*0.85,-r*1.12,r*1.7,r*0.4);ctx.fillRect(-r*0.85,r*0.72,r*1.7,r*0.4);
  ctx.fillStyle=b.dark;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(-r*0.06,-r*0.06,r*0.84,0,7);ctx.fill();
  ctx.fillStyle=b.dash>0?'#ffffff':'#e9e6da';ctx.beginPath();ctx.moveTo(r*0.55,-r*0.75);ctx.lineTo(r*1.12,-r*0.4);ctx.lineTo(r*1.12,r*0.4);ctx.lineTo(r*0.55,r*0.75);ctx.closePath();ctx.fill();
  ctx.fillStyle='#14131f';ctx.beginPath();ctx.arc(r*0.12,0,r*0.3,0,7);ctx.fill();
  ctx.fillStyle=b.dash>0?'#ff4d6d':'#f1efe6';ctx.beginPath();ctx.arc(r*0.2,0,r*0.12,0,7);ctx.fill();
  ctx.restore();
  if(b.frozen>0){ctx.fillStyle='rgba(143,216,255,.45)';ctx.strokeStyle='#8fd8ff';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;ctx.lineTo(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3)}ctx.closePath();ctx.fill();ctx.stroke()}
  if(isMine(b)&&b.cd>0&&b.frozen<=0){ctx.strokeStyle=b.color;ctx.globalAlpha=0.75;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r+7,-Math.PI/2,-Math.PI/2+(1-b.cd/DASH_CD)*Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  try{
    if(mode==='guest'){if(state!=='lobby')guestTick(dt);else time+=dt}
    else if(state==='play'||state==='goal')step(dt);else time+=dt;
    if(room&&mode==='host')hostNet(now);
    if(room&&mode==='guest')guestNet(now);
  }catch(e){console.error(e)}
  draw();requestAnimationFrame(frame);
}
resize();kickoff();startCard();requestAnimationFrame(frame);
</script>
